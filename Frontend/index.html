<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/Logo.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA: installable app + theme -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0f0d" />
    <link rel="apple-touch-icon" href="/Logo.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Misty Mounts" />

    <meta name="description" content="Discover Northern Pakistan — vetted local guides, stays and group tours across Hunza, Skardu, Swat and beyond, with safe escrow booking." />

    <!-- Organization structured data (homepage) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Misty Mounts",
        "description": "Northern Pakistan travel marketplace — vetted local guides, stays and group tours.",
        "url": "https://www.mistymounts.pk",
        "logo": "https://www.mistymounts.pk/Logo.png",
        "areaServed": "Northern Pakistan"
      }
    </script>

    <!-- Open Graph / social share -->
    <meta property="og:title" content="Misty Mounts — Northern Pakistan Travel" />
    <meta property="og:description" content="Vetted local guides, stays and group tours across Northern Pakistan — with safe escrow booking." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/main logo.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Type system: Space Grotesk (headings) · Poppins (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Misty Mounts — Northern Pakistan Travel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
